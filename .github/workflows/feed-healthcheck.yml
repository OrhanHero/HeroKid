name: Feed-Healthcheck

# RSS-Endpunkte sterben schleichend (Anbieter strukturieren um), und die App überspringt tote
# Feeds bewusst geräuschlos - im Kiosk-Betrieb merkt das niemand. Dieser wöchentliche Lauf prüft
# alle URLs aus NewsFeedSource.cs und wird rot, sobald ein Feed tot ist (siehe scripts/check-feeds.py).

on:
  schedule:
    # Montags 06:00 UTC - vor dem ersten Lernen der Woche.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      urls:
        description: >-
          Optional: einzelne Kandidaten-URLs (durch Leerzeichen getrennt) statt des Katalogs prüfen.
          Gedacht zum Testen einer Ersatz-URL, bevor sie in NewsFeedSource.cs wandert - aus einer
          Entwicklungsumgebung ohne Zugriff auf die Nachrichten-Domains geht das sonst gar nicht.
        required: false
        default: ""

jobs:
  check-feeds:
    # Reine HTTP-Checks, kein .NET nötig - ubuntu ist der schnellste/billigste Runner.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Feed-URLs prüfen
        # Ohne Eingabe der volle Katalog, mit Eingabe genau die genannten URLs. Die Eingabe geht
        # bewusst über eine Umgebungsvariable statt direkt in die Kommandozeile interpoliert zu
        # werden (sonst wäre der Eingabewert Shell-Code); $URLS bleibt unquotiert, damit mehrere
        # durch Leerzeichen getrennte URLs zu mehreren Argumenten werden.
        env:
          URLS: ${{ github.event.inputs.urls }}
        run: python3 scripts/check-feeds.py $URLS
