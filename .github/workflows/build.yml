name: Build & Test

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

# Ein neuer Push auf denselben Branch macht den laufenden Lauf wertlos - abbrechen statt
# zwei Läufe um die Runner konkurrieren zu lassen. Achtung beim Prüfen: ein abgebrochener Lauf
# ist nicht "rot", sondern überholt. Maßgeblich ist der Lauf, dessen head_sha dem eigenen Commit
# entspricht (siehe CLAUDE.md, "A green CI badge ...").
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  # Schnelle Rückmeldung in etwa zwei Minuten: baut die GANZE Solution unter Linux (auch die
  # WPF-App - EnableWindowsTargeting in Directory.Build.props macht das möglich) und führt die
  # Unit-Tests aus. Fängt Tippfehler, fehlende usings und XAML-Übersetzungsfehler (MC3024 …),
  # bevor der langsame Windows-Lauf fertig ist. Ersetzt ihn NICHT: UI-Tests, Publish und die
  # Prüfung der KI-Bibliotheken gibt es nur unter Windows.
  linux-schnell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-linux-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-linux-

      - name: NuGet-Pakete wiederherstellen
        run: dotnet restore LernTor.sln

      - name: Solution bauen (Release, inkl. WPF-App)
        run: dotnet build LernTor.sln --configuration Release --no-restore

      - name: Unit-Tests ausführen
        run: dotnet test tests/LernTor.Tests/LernTor.Tests.csproj --configuration Release --no-build

      - name: Python für Content-Checks einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Vorab-Prüfung und Längen-Bias-Wächter
        run: |
          python scripts/preflight.py
          python scripts/check-answer-length-bias.py

  build:
    # windows-latest ist nötig, um die WPF-App und die UI-Tests AUSZUFÜHREN und den
    # self-contained win-x64-Build zu veröffentlichen. Bauen allein ginge auch unter Linux
    # (siehe Job linux-schnell).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: .NET 10 SDK einrichten
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: NuGet-Cache
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-windows-${{ hashFiles('Directory.Packages.props', '**/*.csproj', 'global.json') }}
          restore-keys: nuget-windows-

      - name: NuGet-Pakete wiederherstellen
        run: dotnet restore LernTor.sln

      - name: Solution bauen (Release)
        run: dotnet build LernTor.sln --configuration Release --no-restore

      - name: Unit-Tests ausführen
        run: dotnet test tests/LernTor.Tests/LernTor.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: UI-Smoke-Tests ausführen (XAML-Load + Start der echten exe)
        # Fängt die XamlParseException-Bug-Klasse (kompiliert sauber, crasht erst beim Laden),
        # die kein Unit-Test abdecken kann - siehe tests/LernTor.UiTests.
        run: dotnet test tests/LernTor.UiTests/LernTor.UiTests.csproj --configuration Release --no-build --verbosity normal
        env:
          # DesignScreenshotTests legt hier PNGs der wichtigsten Ansichten ab (1366x768, jedes
          # Design) - das Aussehen ist in der Linux-Entwicklungsumgebung sonst nicht pruefbar.
          LERNTOR_SCREENSHOT_DIR: ${{ github.workspace }}/design-vorschau

      - name: Design-Vorschau hochladen
        # Auch bei roten Tests: gerade dann will man sehen, wie es aussah.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Design-Vorschau
          path: design-vorschau
          if-no-files-found: warn
          retention-days: 30

      - name: Python für Content-Checks einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Vorab-Prüfung (Fehlerklassen, die der Compiler nicht sieht)
        # Laufzeit-Fallen wie <Run Text="{Binding ...}"> ohne Mode=OneWay, tote Bindings,
        # Shutdown() ohne vorheriges Unlock() oder unvollständig verdrahtete neue Fächer
        # kompilieren sauber und fallen sonst erst beim Kind auf - siehe scripts/preflight.py.
        run: python scripts/preflight.py

      - name: Längen-Bias-Wächter (Distraktoren dürfen nicht "richtig = längste Option" verraten)
        # Kinder lernen sonst schnell "nimm die längste Antwort" statt den Inhalt zu lesen -
        # siehe scripts/check-answer-length-bias.py. Schwelle 60% pro Generator, Zielwert der
        # Nachbesserungen liegt bei ~35% (nahe Zufallserwartung).
        run: python scripts/check-answer-length-bias.py

      - name: Self-contained Windows-Build veröffentlichen
        # Identische Flags wie der dokumentierte Release-Build (docs/BUILD.md), damit das
        # CI-Artefakt wirklich dem entspricht, was auch installiert wird: Single-File +
        # ReadyToRun (schneller Kaltstart nach dem Autostart-Login).
        # BEWUSST OHNE IncludeNativeLibrariesForSelfExtract: LLamaSharp sucht llama.dll/ggml*.dll
        # selbst per Dateipfad neben der EXE. Landen sie im Bundle, findet es sie nicht und die
        # KI-Funktionen scheitern mit "The type initializer for 'LLama.Native.NativeApi' threw an
        # exception" - siehe LernTor.App.csproj.
        run: >
          dotnet publish src/LernTor.App/LernTor.App.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:PublishReadyToRun=true
          --output publish/win-x64

      - name: Prüfen, dass die KI-Bibliotheken lose neben der EXE liegen
        # Diese Bug-Klasse fällt sonst erst beim Kind auf: die App startet normal, nur der
        # KI-Chat und der Lehrer-Import scheitern. Der vorherige Versuch, das per MSBuild-Target
        # zu lösen, lief still ins Leere - deshalb wird das Ergebnis hier hart geprüft statt
        # angenommen.
        shell: pwsh
        run: |
          # REKURSIV suchen: LLamaSharp.Backend.Cpu liefert je CPU-Variante einen eigenen
          # Unterordner (runtimes/win-x64/native/avx2/ usw.), die Dateien liegen also NICHT
          # flach neben der EXE. Eine erste Fassung dieser Prüfung suchte nur im Wurzelordner
          # und meldete deshalb fälschlich "keine gefunden".
          # Bewusst keine feste Liste erwarteter Dateinamen: die ändern sich zwischen
          # LLamaSharp-/llama.cpp-Versionen. Die Fundstellen werden protokolliert, damit eine
          # Änderung am Backend-Layout im Log sichtbar wird, statt still zu passieren.
          $found = Get-ChildItem publish/win-x64 -Recurse -Filter *.dll -ErrorAction SilentlyContinue |
                     Where-Object { $_.Name -match '^(llama|ggml|mtmd|llava)' }
          $root = (Resolve-Path publish/win-x64).Path
          Write-Host "Gefundene native KI-Bibliotheken:"
          if ($found) {
            $found | ForEach-Object { Write-Host "  $($_.FullName.Substring($root.Length + 1))" }
          } else {
            Write-Host "  (keine)"
          }

          if (-not ($found | Where-Object { $_.Name -eq 'llama.dll' })) {
            Write-Error "llama.dll liegt nicht als lose Datei im Publish-Ordner. LLamaSharp sucht sie per Dateipfad neben der EXE - ohne sie scheitern KI-Chat und Lehrer-Import auf dem Zielrechner mit 'The type initializer for LLama.Native.NativeApi threw an exception'."
            exit 1
          }
          if (-not ($found | Where-Object { $_.Name -like 'ggml*' })) {
            Write-Error "Keine ggml-Bibliothek gefunden. llama.dll allein kann das Modell nicht laden."
            exit 1
          }
          Write-Host "OK - die nativen KI-Bibliotheken liegen als lose Dateien im Artefakt."

      - name: Build-Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: LernTor-win-x64
          path: publish/win-x64
